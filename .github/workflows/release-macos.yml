name: Release macOS

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      updater_endpoint:
        type: string
        required: false
        default: "https://get.yaoapps.com/yaoagents/latest.json"
      release_tag:
        type: string
        required: false
        default: ""
      publish_target:
        type: string
        required: false
        default: "cdn"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
      updater_endpoint:
        description: "Updater manifest endpoint"
        required: false
        default: "https://get.yaoapps.com/yaoagents/latest.json"
      release_tag:
        description: "GitHub Release tag (empty = v<version>)"
        required: false
        default: ""
      publish_target:
        description: "cdn (stable) or github (nightly)"
        required: false
        default: "cdn"

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  build-desktop:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-apple-darwin
          - arch: amd64
            rust_target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      # ── Toolchains ──

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # ── Caching ──

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ matrix.rust_target }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: cargo-${{ matrix.rust_target }}-

      # ── Build CUI ──

      - name: Pull CUI source
        run: bash scripts/pull-cui.sh

      - name: Build CUI
        run: bash scripts/build-cui.sh

      # ── Build Desktop App ──

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Patch version and updater config
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          UPDATER_ENDPOINT: ${{ inputs.updater_endpoint }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          cd src-tauri
          python3 -c "
          import json, os
          with open('tauri.conf.json') as f:
              conf = json.load(f)
          conf['version'] = '${VERSION}'
          conf['bundle']['targets'] = ['app']
          conf['bundle']['createUpdaterArtifacts'] = True
          pubkey = os.environ.get('TAURI_UPDATER_PUBKEY', '')
          if pubkey:
              conf.setdefault('plugins', {}).setdefault('updater', {})
              conf['plugins']['updater']['pubkey'] = pubkey
              conf['plugins']['updater']['endpoints'] = [os.environ.get('UPDATER_ENDPOINT', 'https://get.yaoapps.com/yaoagents/latest.json')]
          with open('tauri.conf.json', 'w') as f:
              json.dump(conf, f, indent=2)
              f.write('\n')
          "
          sed -i '' "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          cd ..
          echo "Patched to version ${VERSION}"

      # ── Apple Code Signing ──

      - name: Import Apple certificates
        env:
          APPLE_DEVELOPERIDG2CA: ${{ secrets.APPLE_DEVELOPERIDG2CA }}
          APPLE_DISTRIBUTION: ${{ secrets.APPLE_DISTRIBUTION }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_PRIVATE_KEY_PASSWORD: ${{ secrets.APPLE_PRIVATE_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          mkdir -p certs
          echo "$APPLE_DEVELOPERIDG2CA" | base64 --decode > certs/DeveloperIDG2CA.cer
          echo "$APPLE_DISTRIBUTION" | base64 --decode > certs/distribution.cer
          echo "$APPLE_PRIVATE_KEY" | base64 --decode > certs/private_key.p12

          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import ./certs/DeveloperIDG2CA.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign
          security import ./certs/distribution.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign
          security import ./certs/private_key.p12 -k $KEYCHAIN_PATH -P "$APPLE_PRIVATE_KEY_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          rm -rf certs

      - name: Build Tauri app
        run: cargo tauri build --target ${{ matrix.rust_target }}
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: ${{ secrets.APPLE_SIGN }}"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Sign .app bundle
        env:
          APPLE_SIGN: ${{ secrets.APPLE_SIGN }}
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          IDENTITY="Developer ID Application: ${APPLE_SIGN}"
          APP_BUNDLE=$(find "$BUNDLE_DIR" -name "*.app" -type d | head -1 || true)
          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::No .app bundle found"
            exit 1
          fi
          codesign --deep --force --verbose --timestamp --options runtime \
            --entitlements src-tauri/Entitlements.plist \
            --sign "$IDENTITY" "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"

      - name: Rebuild DMG with Applications symlink
        env:
          APPLE_SIGN: ${{ secrets.APPLE_SIGN }}
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          IDENTITY="Developer ID Application: ${APPLE_SIGN}"
          APP_BUNDLE=$(find "$BUNDLE_DIR" -name "*.app" -type d | head -1 || true)
          APP_NAME=$(basename "$APP_BUNDLE" .app)
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"

          OLD_DMG=$(find "$BUNDLE_DIR" -name "*.dmg" | head -1 || true)
          [ -n "$OLD_DMG" ] && rm -f "$OLD_DMG"

          DMG_PATH="${BUNDLE_DIR}/dmg/yaoagents-${VERSION}-darwin-${ARCH}.dmg"
          mkdir -p "$(dirname "$DMG_PATH")"

          STAGING="/tmp/dmg-staging"
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          touch "$STAGING/.metadata_never_index"
          cp -R "$APP_BUNDLE" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          sleep 2
          hdiutil create -volname "$APP_NAME" -srcfolder "$STAGING" \
            -ov -format UDZO "$DMG_PATH"
          bash scripts/codesign-dmg-retry.sh "$IDENTITY" "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"

      - name: Collect artifacts
        id: collect
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          BUNDLE_DIR="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          mkdir -p release

          DMG_FILE=$(find "$BUNDLE_DIR" -name "*.dmg" | head -1 || true)
          [ -n "$DMG_FILE" ] && cp "$DMG_FILE" "release/yaoagents-${VERSION}-darwin-${ARCH}.dmg"

          TAR_FILE=$(find "$BUNDLE_DIR/macos" -name "*.app.tar.gz" 2>/dev/null | head -1 || true)
          SIG_FILE=$(find "$BUNDLE_DIR/macos" -name "*.app.tar.gz.sig" 2>/dev/null | head -1 || true)
          [ -n "$TAR_FILE" ] && cp "$TAR_FILE" "release/yaoagents-${VERSION}-darwin-${ARCH}.app.tar.gz"
          [ -n "$SIG_FILE" ] && cp "$SIG_FILE" "release/yaoagents-${VERSION}-darwin-${ARCH}.app.tar.gz.sig"

          ls -la release/

      # ── Notarize & staple (synchronous, blocking) ──
      # Runs on the freshly built DMG so every uploaded artifact is
      # already notarized/stapled. Apple certificates are still imported
      # by the "Import Apple certificates" step earlier in this job.

      - name: Notarize and staple artifacts
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAME_ID: ${{ secrets.APPLE_TEAME_ID }}
          APPLE_APP_SPEC_PASS: ${{ secrets.APPLE_APP_SPEC_PASS }}
          APPLE_SIGN: ${{ secrets.APPLE_SIGN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          IDENTITY="Developer ID Application: ${APPLE_SIGN}"

          DMG_FILE="release/yaoagents-${VERSION}-darwin-${ARCH}.dmg"
          if [ ! -f "$DMG_FILE" ]; then
            echo "::error::DMG not found: $DMG_FILE"
            exit 1
          fi

          # Extract the .app bundle from the built DMG.
          MOUNT_DIR="/tmp/dmg-mount"
          rm -rf "$MOUNT_DIR" && mkdir -p "$MOUNT_DIR"
          hdiutil attach "$DMG_FILE" -mountpoint "$MOUNT_DIR" -nobrowse -quiet
          APP_BUNDLE=$(find "$MOUNT_DIR" -maxdepth 1 -name "*.app" -type d | head -1 || true)
          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::No .app found inside DMG"
            hdiutil detach "$MOUNT_DIR" -quiet || true
            exit 1
          fi
          APP_NAME=$(basename "$APP_BUNDLE" .app)
          rm -rf "/tmp/${APP_NAME}.app"
          cp -R "$APP_BUNDLE" "/tmp/${APP_NAME}.app"
          hdiutil detach "$MOUNT_DIR" -quiet

          # Submit the zipped .app and the DMG, blocking until resolved.
          submit_and_wait() {
            local submission_path="$1"
            local label="$2"
            echo "Submitting ${label} to Apple notary service (blocking)..."
            local result
            result=$(xcrun notarytool submit "$submission_path" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAME_ID" \
              --password "$APPLE_APP_SPEC_PASS" \
              --wait \
              --output-format json)
            echo "$result"

            local status submission_id
            status=$(echo "$result" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))")
            if [ "$status" != "Accepted" ]; then
              submission_id=$(echo "$result" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
              if [ -n "$submission_id" ]; then
                xcrun notarytool log "$submission_id" \
                  --apple-id "$APPLE_ID" \
                  --team-id "$APPLE_TEAME_ID" \
                  --password "$APPLE_APP_SPEC_PASS" || true
              fi
              echo "::error::Notarization of ${label} was not accepted (status: ${status})"
              exit 1
            fi
            echo "${label} notarization accepted."
          }

          APP_ZIP="/tmp/app-for-notarize.zip"
          rm -f "$APP_ZIP"
          zip -r "$APP_ZIP" "/tmp/${APP_NAME}.app"
          submit_and_wait "$APP_ZIP" ".app"
          rm -f "$APP_ZIP"

          # Staple the notarization ticket onto the .app.
          xcrun stapler staple "/tmp/${APP_NAME}.app"
          xcrun stapler validate "/tmp/${APP_NAME}.app"
          echo ".app stapled successfully."

          # Rebuild the DMG around the stapled .app, then staple it.
          rm -f "$DMG_FILE"
          STAGING="/tmp/dmg-staging"
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          touch "$STAGING/.metadata_never_index"
          cp -R "/tmp/${APP_NAME}.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "$STAGING" \
            -ov -format UDZO "$DMG_FILE"
          bash scripts/codesign-dmg-retry.sh "$IDENTITY" "$DMG_FILE"
          # IMPORTANT: notarize the FINAL (rebuilt) DMG. Submitting the pre-rebuild DMG
          # leaves the rebuilt one un-notarized, so `stapler staple` fails with Error 65.
          submit_and_wait "$DMG_FILE" "DMG"
          xcrun stapler staple "$DMG_FILE"
          xcrun stapler validate "$DMG_FILE"
          echo "DMG rebuilt with stapled .app and stapled."

          # Re-create the updater tarball from the stapled .app and re-sign it.
          TAR_NAME="yaoagents-${VERSION}-darwin-${ARCH}.app.tar.gz"
          TAR_PATH="release/${TAR_NAME}"
          rm -f "$TAR_PATH" "${TAR_PATH}.sig"
          tar -czf "$TAR_PATH" -C /tmp "${APP_NAME}.app"

          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            cargo tauri signer sign \
              --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
              --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" \
              "$TAR_PATH"
            echo "Re-signed updater artifact: ${TAR_PATH}.sig"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set, skipping .sig generation"
          fi

          ls -la release/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cui-desktop-macos-${{ matrix.arch }}-${{ steps.version.outputs.version }}
          path: release/*

      - name: Upload to CDN
        if: ${{ inputs.publish_target != 'github' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINTS: ${{ secrets.R2_ENDPOINTS }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'releases' }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "R2 credentials not set, skipping CDN upload."
            exit 0
          fi
          aws configure set default.region us-east-1
          aws configure set default.s3.signature_version s3v4

          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          CDN_PREFIX="s3://${R2_BUCKET}/yaoagents/${VERSION}"

          upload_file() {
            local src="$1" ctype="$2"
            [ -f "$src" ] || return 0
            local name; name=$(basename "$src")
            aws s3 cp "$src" "${CDN_PREFIX}/${name}" \
              --endpoint-url "$R2_ENDPOINTS" --content-type "${ctype}"
            echo "Uploaded: ${name}"
          }

          upload_file "release/yaoagents-${VERSION}-darwin-${ARCH}.dmg" "application/x-apple-diskimage"
          upload_file "release/yaoagents-${VERSION}-darwin-${ARCH}.app.tar.gz" "application/gzip"
          upload_file "release/yaoagents-${VERSION}-darwin-${ARCH}.app.tar.gz.sig" "text/plain"

  # ===================================================================
  # Upload to unified GitHub Release
  # ===================================================================
  release:
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: cui-desktop-macos-arm64-${{ inputs.version }}
          path: release

      - name: Download amd64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: cui-desktop-macos-amd64-${{ inputs.version }}
          path: release

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag || format('v{0}', inputs.version) }}"
          ls -la release/
          gh release upload "$TAG" release/* --repo ${{ github.repository }} --clobber
          echo "Uploaded macOS artifacts to release $TAG"

  # ===================================================================
  # Trigger update-latest to publish latest.json (stable/CDN only).
  # Replaces the trigger that used to live in the now-deleted macOS staple
  # workflow, so the rolling latest.json is refreshed once the
  # notarized/stapled macOS artifacts are on the CDN. Nightly
  # (publish_target=github) must not touch the stable manifest.
  # ===================================================================
  publish-latest:
    needs: build-desktop
    if: always() && needs.build-desktop.result == 'success' && inputs.publish_target != 'github'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger update-latest workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run update-latest.yml \
            --repo ${{ github.repository }} \
            -f version="${{ inputs.version }}" \
            -f mark_latest="true"
          echo "Triggered update-latest: version=${{ inputs.version }}"
